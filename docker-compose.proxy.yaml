services:
  ttyd-proxy:
    image: 'caddy:2-alpine'
    restart: unless-stopped
    command:
      - sh
      - '-c'
      - "printf ':8080 {\\n  reverse_proxy %s\\n}\\n' \"$${BRIDGE_ENDPOINT:?Set BRIDGE_ENDPOINT to the Tailscale address of the bridge}\" > /etc/caddy/Caddyfile\ncaddy run --config /etc/caddy/Caddyfile --adapter caddyfile\n"
    expose:
      - '8080'
    networks:
      - coolify
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -S -O /dev/null http://127.0.0.1:8080/ 2>&1 | grep -E 'HTTP/.* (200|401|403)' >/dev/null"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.ttyd-proxy.rule=Host(`${DOMAIN:-agentdesk.example.com}`)
      - traefik.http.routers.ttyd-proxy.entrypoints=https
      - traefik.http.routers.ttyd-proxy.tls=true
      - traefik.http.routers.ttyd-proxy.priority=999999
      - traefik.http.routers.ttyd-proxy.service=ttyd-proxy-svc
      - traefik.http.services.ttyd-proxy-svc.loadbalancer.server.port=8080
networks:
  coolify:
    external: true
