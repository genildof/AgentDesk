services:
  ttydbridge:
    image: 'cp0204/ttydbridge:latest'
    restart: unless-stopped
    privileged: true
    pid: host
    ipc: host
    environment:
      PORT: '2222'
      EXEC_DIR: /opt
      ALLOW_WRITE: '${ALLOW_WRITE:-true}'
      START_COMMAND: >-
        bash -lc 'if [ -n "$${DEFAULT_USER:-}" ]; then workspace="$${DEFAULT_WORKSPACE:-/home/$${DEFAULT_USER}}"; exec su - "$${DEFAULT_USER}" -c "cd \"$${workspace}\" && exec bash +m"; fi; cd "$${DEFAULT_WORKSPACE:-/}" && exec bash +m'
      ENABLE_SSL: 'false'
      DEFAULT_USER: '${DEFAULT_USER:-}'
      DEFAULT_WORKSPACE: '${DEFAULT_WORKSPACE:-}'
      HTTP_USERNAME: '${HTTP_USERNAME:-}'
      HTTP_PASSWORD: '${HTTP_PASSWORD:-}'
    volumes:
      - '/opt:/opt'
