services:
  agentdesk:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - '8080'
    environment:
      PORT: '${PORT:-8080}'
      WEB_USERNAME: '${WEB_USERNAME:-}'
      WEB_PASSWORD: '${WEB_PASSWORD:-}'
      SSH_HOST: '${SSH_HOST:-}'
      SSH_PORT: '${SSH_PORT:-22}'
      SSH_USER: '${SSH_USER:-}'
      SSH_PRIVATE_KEY: '${SSH_PRIVATE_KEY:-}'
      SSH_KNOWN_HOSTS: '${SSH_KNOWN_HOSTS:-}'
      SSH_STRICT_HOST_KEY_CHECKING: '${SSH_STRICT_HOST_KEY_CHECKING:-yes}'
      SSH_REMOTE_COMMAND: '${SSH_REMOTE_COMMAND:-}'
      SSH_SESSION_PERSISTENT: '${SSH_SESSION_PERSISTENT:-false}'
      SSH_SESSION_NAME: '${SSH_SESSION_NAME:-agentdesk}'
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1:$${PORT:-8080}/"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
